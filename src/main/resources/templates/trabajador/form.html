<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Trabajador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2>Editar Trabajador</h2>

<form th:action="@{/trabajador/guardar}" method="post" th:object="${trabajador}" class="w-50 my-3">

    <div class="mb-3">
        <label class="form-label">DNI del Trabajador</label>
        <input type="text" class="form-control" th:field="*{dni}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Correo del Trabajador</label>
        <input type="email" class="form-control" th:field="*{correo}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Nombre del Trabajador</label>
        <input type="text" class="form-control" th:field="*{nombres}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Apellidos del Trabajador</label>
        <input type="text" class="form-control" th:field="*{apellidos}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Sede</label>
        <select class="form-select" th:field="*{sede.idSede}" required>
            <option value="" disabled selected>-- Seleccione Sede --</option>
            <option th:each="s : ${listaSedes}" th:value="${s.idSede}" th:text="${s.nombreSede}"></option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
    <a href="/trabajador" class="btn btn-danger">Cancelar</a>
</form>
</body>
</html>
