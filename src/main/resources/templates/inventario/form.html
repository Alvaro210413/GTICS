<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2 th:text="${inventario.idInventario == null} ? 'Nuevo Inventario' : 'Editar Inventario'">Formulario Inventario</h2>

<form th:action="@{/inventario/guardar}" method="post" th:object="${inventario}" class="w-50 my-3">
    <input type="hidden" th:field="*{idInventario}">

    <div class="mb-3">
        <label class="form-label">Nombre del Inventario</label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Número de Serie</label>
        <input type="text" class="form-control" th:field="*{numeroSerie}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Sede</label>
        <select class="form-select" th:field="*{sede.idSede}" required>
            <option value="" disabled selected>-- Seleccione Sede --</option>
            <option th:each="s : ${listaSedes}" th:value="${s.idSede}" th:text="${s.nombreSede}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Marca</label>
        <select class="form-select" th:field="*{marca.idMarca}" required>
            <option value="" disabled selected>-- Seleccione Marca --</option>
            <option th:each="m : ${listaMarcas}" th:value="${m.idMarca}" th:text="${m.nombre}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo de Equipo</label>
        <select class="form-select" th:field="*{tipo.idTipo}" required>
            <option value="" disabled selected>-- Seleccione Tipo --</option>
            <option th:each="t : ${listaTipos}" th:value="${t.idTipo}" th:text="${t.nombre}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Estado</label>
        <select class="form-select" th:field="*{estado}" required>
            <option value="" disabled selected>-- Seleccione Estado --</option>
            <option value="almacen">Almacen</option>
            <option value="pedido">Pedido</option>
            <option value="vendido">Vendido</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
    <a href="/inventario" class="btn btn-danger">Cancelar</a>
</form>
</body>
</html>
