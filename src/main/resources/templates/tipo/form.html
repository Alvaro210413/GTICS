<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Tipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<h2 th:text="${tipo.idTipo == null} ? 'Nuevo Tipo' : 'Editar Tipo'">Formulario Tipo</h2>

<form th:action="@{/tipo/guardar}" method="post" th:object="${tipo}" class="w-50 my-3">
    <input type="hidden" th:field="*{idTipo}">

    <div class="mb-3">
        <label class="form-label">Nombre del Tipo</label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <button type="submit" class="btn btn-primary">Registrar</button>
    <a href="/tipo" class="btn btn-danger">Cancelar</a>
</form>
</body>
</html>
