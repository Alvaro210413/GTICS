<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<nav class="nav nav-tabs mb-4">
    <a class="nav-link" href="/inventario">Inventario</a>
    <a class="nav-link active" href="/marca">Marcas</a>
    <a class="nav-link" href="/tipo">Tipos de Equipo</a>
    <a class="nav-link" href="/sede">Sedes</a>
    <a class="nav-link" href="/trabajador">Trabajadores</a>
</nav>

<h2>Lista de Marcas</h2>

<div th:if="${msg}" class="alert alert-success my-3"
     th:classappend="${#strings.contains(msg, 'borrada')} ? 'alert-danger' : 'alert-success'"
     th:text="${msg}"></div>

<a href="/marca/nueva" class="btn btn-primary my-3">Nueva Marca</a>

<table class="table table-striped align-middle">
    <thead>
    <tr>
        <th>#</th>
        <th>Nombre de la Marca</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="m, stat : ${listaMarcas}">
        <td th:text="${stat.index + 1}">1</td>
        <td th:text="${m.nombre}">Nombre</td>
        <td>
            <a th:href="@{'/marca/editar?id=' + ${m.idMarca}}" class="btn btn-primary btn-sm">Editar</a>
            <a th:href="@{'/marca/borrar?id=' + ${m.idMarca}}" class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar esta marca?')">Borrar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
